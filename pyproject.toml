[project]
name = "docai"
version = "0.1.0"
description = "Scanned invoice PDFs (French, English, Arabic) to validated, confidence-scored JSON with a human review queue"
readme = "README.md"
authors = [
    { name = "Yassine El Ouni", email = "yassine.elouni.dev@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.20,<1.24",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "rapidocr>=3.10.0",
    "uvicorn[standard]>=0.54.0",
]

license = "MIT"

[project.scripts]
docai = "docai.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
datagen = [
    "arabic-reshaper>=3.0.1",
    "faker>=40.43.0",
    "matplotlib>=3.11.2",
    "python-bidi>=0.6.12",
]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
# onnxruntime stopped shipping Intel-macOS wheels; keep the lock resolvable there too.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PTH"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF001", "RUF002", "RUF003", "PLC0415", "PLW2901"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "eval", "tests"]

[[tool.mypy.overrides]]
module = ["rapidocr.*", "pypdfium2.*", "arabic_reshaper.*", "bidi.*", "faker.*", "matplotlib.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: runs the real OCR models (downloads them on first use)"]
